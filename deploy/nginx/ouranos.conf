# Example nginx reverse-proxy config for Ouranos.
#
# This is a TEMPLATE, each ${OURANOS_DIR} should be expanded into its actual value

# Use "upgrade" connection header for socket.io while the client is upgrading,
#  "close" otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Use X-Forwarded-Proto if already set by the tunnel rather than the $scheme
# that will always be plain http if accessed through the tunnel
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Ouranos-core's FastAPI server
upstream ouranos_api {
    server 127.0.0.1:5000;
    keepalive 8;
}

# Ouranos-frontend's node server
upstream sveltekit {
    server 127.0.0.1:3000;
    keepalive 8;
}

# RabbitMQ management UI
upstream rabbitmq_management {
    server 127.0.0.1:15672;
}

upstream db_management {
    server 127.0.0.1:5020;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    keepalive_timeout 5;
    client_max_body_size 5m;

    access_log /var/log/nginx/ouranos_access.log;
    error_log  /var/log/nginx/ouranos_error.log;

    error_page 500 502 503 504 /unavailable.html;

    # Recover the real client IP from the tunnel/proxy so $remote_addr (logs,
    # rate limiting, deny rules) is correct instead of 127.0.0.1.
    set_real_ip_from  127.0.0.1;
    set_real_ip_from  ::1;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # Security response headers (also emitted on error responses).
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /favicon.ico {
        alias ${OURANOS_DIR}/lib/ouranos-frontend/static/favicon.ico;
    }

    # Ouranos-core's API
    location /api/ {
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;

        proxy_pass http://ouranos_api;
    }

    # Ouranos-core's Socket.IO
    location /socket.io {
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;

        proxy_read_timeout 3600s;
        proxy_pass http://ouranos_api;
    }

    # Ouranos aggregator file server
    location /aggregator/ {
        proxy_pass http://127.0.0.1:7191/;
    }

    # Ouranos frontend
    location / {
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Request-ID      $request_id;

        proxy_pass http://sveltekit;
    }

    # Ouranos static files (the directory is created by Ouranos on startup)
    location /static/ {
        autoindex on;
        alias ${OURANOS_DIR}/static/;
    }

    # RabbitMQ management UI
    location /rabbitmq/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_pass http://rabbitmq_management/;
    }

    # phpMyAdmin
    location /phpmyadmin/ {
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        rewrite ^/phpmyadmin(/.*)$ $1 break;

        proxy_pass http://db_management/;
    }

    # Error page
    location /unavailable.html {
        root /var/www/html;
        internal;
    }
}
